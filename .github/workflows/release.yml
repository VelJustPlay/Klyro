name: Publish Klyro release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Velopack CLI
        run: dotnet tool install vpk --tool-path tools --version 1.2.161

      - name: Build installer and update packages
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must contain a semantic version, for example v1.0.1."
          }

          dotnet publish LightweightBrowser.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish `
            "-p:Version=$version" `
            "-p:AssemblyVersion=$version.0" `
            "-p:FileVersion=$version.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\tools\vpk.exe pack `
            --packId Klyro `
            --packVersion $version `
            --packDir publish `
            --runtime win-x64 `
            --mainExe Klyro.exe `
            --packTitle "Klyro Browser" `
            --icon Assets/Klyro.ico `
            --outputDir Releases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem Releases -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME $assets `
            --title "Klyro $($env:GITHUB_REF_NAME)" `
            --generate-notes
